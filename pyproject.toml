[project]
name = "countgd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "addict==2.4.0",
    "colorlog==6.8.2",
    "cython==3.0.9",
    "numpy==1.26.4",
    "nvidia-cuda-nvcc-cu12==12.6.*",
    "nvidia-cuda-runtime-cu12>=12.4.127",
    "opencv-python==4.9.0.80",
    "pycocotools==2.0.7",
    "pyyaml==6.0.1",
    "scipy==1.12.0",
    "submitit==1.5.1",
    "supervision==0.6.0",
    "termcolor==2.4.0",
    "timm==0.9.16",
    "torch==2.6.0+cu126",
    "torchaudio==2.6.0",
    "torchvision==0.21.0+cu126",
    "transformers==4.39.1",
    "yapf==0.40.1",
]

[dependency-groups]
dev = [
    "pip>=26.2",
]

[tool.ty.environment]
python = "./.venv"

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
